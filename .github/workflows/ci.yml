name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test:unit

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: bun x tsc -b tsconfig.json --pretty false
      - run: bun x vitest run packages/tfx/test/smoke.test.ts packages/postgres/test/smoke.test.ts
      - run: bun x vitest run apps/carneloot-bot/test/smoke.test.ts
