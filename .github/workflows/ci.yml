name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tfx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tfx
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter tfx telegram:check
      - run: pnpm check:tfx:package
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm test:integration

  bun:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tfx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tfx
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: bun x tsc -b tsconfig.json --pretty false
      - run: pnpm test:tfx:bun
      - run: bun x vitest run packages/tfx/test/smoke.test.ts packages/postgres/test/smoke.test.ts
      - run: bun x vitest run packages/postgres/test/*.integration.test.ts
      - run: bun x vitest run apps/carneloot-bot/test/smoke.test.ts
