services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carneloot
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - carneloot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d carneloot']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  carneloot-postgres-data:
